name: Build and release

# Every push to main builds Hangar for Windows. Besides checking that it
# builds, that keeps main's Rust build cache current: a release runs under its
# tag, and GitHub lets a tag's run restore caches only from that tag or from
# main, so without these builds every release would compile from scratch.
#
# Publishing a GitHub release tagged vX.Y.Z builds that version and attaches:
#   Hangar_X.Y.Z_x64-setup.exe     the installer; installed copies update from it
#   Hangar_X.Y.Z_x64-portable.exe  the standalone exe (doesn't update itself)
#   latest.json                    what installed copies read to find updates
# The tag is the version: the app and the installer get it from there, so
# tauri.conf.json's version doesn't need bumping.

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push makes an older push's build pointless; a release always finishes.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Only main's cache can be restored by later runs; a tag's can't.
          save-if: ${{ github.event_name == 'push' }}

      - name: Version from the tag
        if: github.event_name == 'release'
        id: version
        run: |
          $v = $env:TAG -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "The release tag must look like v1.2.3 (got '$env:TAG')." }
          "value=$v" >> $env:GITHUB_OUTPUT
          # Merged over tauri.conf.json for this build only.
          @{ version = $v } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/release.conf.json"

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Build
        if: github.event_name == 'push'
        run: bun run tauri build --no-bundle

      - name: Build the release
        if: github.event_name == 'release'
        env:
          # Built into the app, so Settings > About shows this version's notes offline.
          HANGAR_RELEASE_NOTES: ${{ github.event.release.body }}
          HANGAR_RELEASE_DATE: ${{ github.event.release.published_at }}
        run: bun run tauri build --bundles nsis --config "$env:RUNNER_TEMP/release.conf.json"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          NOTES: ${{ github.event.release.body }}
          PUBLISHED: ${{ github.event.release.published_at }}
        run: |
          $release = "src-tauri/target/release"
          $setupName = "Hangar_${env:VERSION}_x64-setup.exe"
          $setup = "$release/bundle/nsis/$setupName"
          if (-not (Test-Path $setup)) { throw "The installer wasn't built: $setup" }
          $portable = "$env:RUNNER_TEMP/Hangar_${env:VERSION}_x64-portable.exe"
          Copy-Item "$release/hangar.exe" $portable
          # Installed copies read this from releases/latest/download/latest.json,
          # which (unlike GitHub's API) has no per-IP hourly limit.
          $latest = "$env:RUNNER_TEMP/latest.json"
          [ordered]@{
            version  = $env:VERSION
            notes    = "$env:NOTES"
            pub_date = $env:PUBLISHED
            url      = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$setupName"
            size     = (Get-Item $setup).Length
          } | ConvertTo-Json | Set-Content $latest -Encoding utf8NoBOM
          Get-Content $latest
          gh release upload $env:TAG $setup $portable $latest --clobber --repo $env:GITHUB_REPOSITORY
