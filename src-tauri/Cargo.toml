[package]
name = "hangar"
version = "0.1.0"
description = "Hangar: a workspace and project dashboard"
authors = ["Yoinky3000"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hangar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "native-tls", "charset", "http2", "system-proxy"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
walkdir = "2.5.1"
which = "8.0.6"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tokio = { version = "1", features = ["sync"] }
base64 = "0.23.1"
semver = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3.27.0"
